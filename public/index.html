<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A3D3A">
<title>Eventwise Planner</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/styles.css">
<script>
/* apply the saved theme before first paint so there is no flash */
try{var s=JSON.parse(localStorage.getItem('eventwise.v1')||'null');if(s&&s.theme)document.documentElement.setAttribute('data-theme',s.theme)}catch(e){}
</script>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <div class="content">
    <header class="top" id="top"></header>
    <main id="main"></main>
  </div>
</div>
<nav class="bnav" id="bnav" aria-label="Sections"></nav>
<div id="modal"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="js/data.js"></script>
<script src="js/ai.js"></script>
<script src="js/app.js"></script>
</body>
</html>
